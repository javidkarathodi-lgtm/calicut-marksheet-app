<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>University of Calicut - Interactive Mark Sheet</title>
    <!-- html2canvas & jsPDF for 100% reliable, single-page side-by-side A4 PDF generation on mobile & desktop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
        }

        body {
            background-color: #cbd5e1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Control Bar (Hidden in Print) */
        .control-bar {
            background: #0f172a;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            width: 794px;
            max-width: 100%;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            font-size: 13px;
            z-index: 20;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
        }

        .btn {
            border: none;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
            font-family: inherit;
            flex: 1;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-download {
            background-color: #059669;
            color: #ffffff;
        }

        .btn-print {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-clear {
            background-color: #dc2626;
            color: #ffffff;
        }

        .btn-cancel {
            background-color: #64748b;
            color: #ffffff;
        }

        /* Mobile View Switcher Bar */
        .mobile-mode-bar {
            display: flex;
            width: 794px;
            max-width: 100%;
            background: #1e293b;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 12px;
            gap: 6px;
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 8px 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: #cbd5e1;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .mode-tab.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        /* Sheet Switcher inside Easy Entry Zoom Mode */
        .mobile-sheet-tabs {
            display: none;
            width: 794px;
            max-width: 100%;
            gap: 8px;
            margin-bottom: 10px;
        }

        .sheet-tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 12.5px;
            font-weight: 700;
            border: 1.5px solid #475569;
            background: #e2e8f0;
            color: #1e293b;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .sheet-tab-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        /* Viewport Wrapper for Smooth A4 Scaling on Mobile */
        .page-viewport {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Single A4 Page Container - Compact vertical height so Print Preview never spills to Page 2 */
        .a4-page {
            background: #ffffff;
            width: 794px;
            min-width: 794px;
            height: 1065px;
            padding: 18px 22px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 22px;
            align-items: start;
            position: relative;
            transform-origin: top center;
            color: #000000;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* Subtle center guide line on screen only */
        .a4-page::after {
            content: "";
            position: absolute;
            top: 14px;
            bottom: 14px;
            left: 50%;
            border-left: 1px dashed #cbd5e1;
            pointer-events: none;
        }

        /* Individual Mark Sheet Column */
        .marksheet {
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            color: #000000;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* Top Row: QP CODE on Left, ORIGINAL / DUPLICATE on Right */
        .top-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .qp-box {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
        }

        .qp-label {
            color: #000000;
            font-weight: 700;
            font-size: 11px;
        }

        .qp-input {
            border: none;
            border-bottom: 1.2px solid #000000;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            width: 120px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #000000;
            padding: 0 2px;
            height: 16px;
        }

        .sheet-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #000000;
            text-transform: uppercase;
        }

        /* Centered University Header */
        .header {
            text-align: center;
            margin-bottom: 5px;
            line-height: 1.18;
        }

        .header h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .header h3 {
            margin: 2px 0 0 0;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* Single-Line Examinations & Course Rows with Auto-Fit Support */
        .meta-line {
            display: flex;
            align-items: baseline;
            width: 100%;
            white-space: nowrap;
            font-size: 11px;
            margin-bottom: 4px;
            color: #000000;
            gap: 2px;
        }

        .course-meta-line {
            display: flex;
            align-items: flex-end;
            width: 100%;
            font-size: 11px;
            margin-bottom: 4px;
            color: #000000;
            gap: 4px;
        }

        .course-label {
            white-space: nowrap;
            padding-bottom: 1px;
        }

        .line-input {
            border: none;
            border-bottom: 1.2px solid #000000;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5px;
            color: #000000;
            padding: 0 2px;
            height: 16px;
            min-width: 0;
        }

        .exam-prefix-input {
            flex: 1 1 auto;
            text-align: center;
            font-weight: 600;
            overflow: hidden;
        }

        /* Wide enough to display "November" without clipping */
        .exam-mid-input {
            width: 58px;
            flex: 0 0 58px;
            text-align: center;
        }

        .exam-year-input {
            width: 20px;
            flex: 0 0 20px;
            text-align: left;
        }

        /* Auto-fitting & Auto-wrapping Course Field so long paper names NEVER truncate */
        .course-input-wrap {
            flex: 1 1 auto;
            min-width: 0;
            border-bottom: 1.2px solid #000000;
            display: flex;
            align-items: flex-end;
            min-height: 16px;
            padding-bottom: 1px;
        }

        .course-textarea {
            width: 100%;
            border: none !important;
            outline: none !important;
            background: transparent !important;
            resize: none;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5px;
            font-weight: 600;
            color: #000000;
            padding: 0 2px;
            margin: 0;
            line-height: 1.15;
            height: 15px;
            min-height: 15px;
            display: block;
            white-space: nowrap;
        }

        .course-textarea.multiline {
            white-space: normal;
            word-break: break-word;
        }

        /* Main Marks Table - Strict Connected Black Grid */
        table.main-table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #000000;
            table-layout: fixed;
            margin-top: 2px;
            margin-bottom: 5px;
        }

        table.main-table th,
        table.main-table td {
            border: 1px solid #000000;
            padding: 0;
            margin: 0;
            height: 23px;
            vertical-align: middle;
            text-align: center;
            font-size: 11px;
            color: #000000;
        }

        table.main-table thead th {
            font-weight: 400;
            height: 19px;
            background: transparent;
        }

        .col-reg {
            width: 38%;
        }

        .col-fig {
            width: 18%;
        }

        .col-words {
            width: 44%;
        }

        /* Seamless Borderless Inputs inside Table Cells */
        .cell-input {
            width: 100%;
            height: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            background: transparent !important;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #000000;
            padding: 0 3px;
            margin: 0;
            display: block;
            text-align: center;
        }

        .reg-input {
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .fig-input {
            text-transform: uppercase;
            font-weight: 700;
        }

        .words-input {
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1px;
        }

        .cell-input:focus,
        .line-input:focus,
        .course-textarea:focus,
        .qp-input:focus,
        .sig-input:focus,
        .date-input:focus {
            background-color: rgba(59, 130, 246, 0.08) !important;
        }

        .total-label {
            text-align: left !important;
            padding-left: 5px !important;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        /* Bottom Examiner Signature Section */
        table.sig-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 1px;
        }

        table.sig-table td {
            border: none;
            padding: 2px 0;
            vertical-align: bottom;
            font-size: 11px;
            color: #000000;
        }

        .sig-label {
            width: 31%;
            font-weight: 700;
            font-style: italic;
            white-space: nowrap;
        }

        .sig-colon {
            width: 4%;
            font-weight: 700;
            text-align: center;
        }

        .sig-name-col {
            width: 35%;
            padding-right: 6px !important;
        }

        .sig-sign-col {
            width: 30%;
        }

        .sig-header-cell {
            text-align: center;
            text-decoration: underline;
            font-size: 11px;
            padding-bottom: 2px !important;
        }

        .sig-input {
            width: 100%;
            border: none;
            border-bottom: 1px dotted #64748b;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5px;
            color: #000000;
            height: 15px;
            padding: 0 2px;
        }

        .date-session-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 4px;
            width: 100%;
        }

        .date-input {
            width: 90px;
            border: none;
            border-bottom: 1px dotted #64748b;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5px;
            color: #000000;
            height: 15px;
            padding: 0 2px;
        }

        .session-box {
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
            white-space: nowrap;
            font-size: 10.5px;
            font-weight: 700;
        }

        .session-select {
            border: none;
            border-bottom: 1px solid #000000;
            background: transparent;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5px;
            font-weight: 700;
            padding: 0 2px;
            outline: none;
            cursor: pointer;
        }

        /* Easy Entry Zoom Mode (Single Sheet Full Width for Comfortable Mobile Typing) */
        body.mobile-entry-mode .mobile-sheet-tabs {
            display: flex;
        }

        body.mobile-entry-mode .a4-page {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 540px !important;
            height: auto !important;
            padding: 14px !important;
            display: block !important;
            transform: none !important;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        body.mobile-entry-mode .a4-page::after {
            display: none;
        }

        body.mobile-entry-mode .marksheet {
            display: none;
        }

        body.mobile-entry-mode .marksheet.mobile-active-sheet {
            display: flex;
        }

        body.mobile-entry-mode table.main-table th,
        body.mobile-entry-mode table.main-table td {
            height: 32px;
            font-size: 13px;
        }

        body.mobile-entry-mode .cell-input {
            font-size: 13.5px;
        }

        body.mobile-entry-mode .words-input {
            font-size: 11.5px;
        }

        /* Clear Confirmation Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            color: #0f172a;
            max-width: 360px;
            width: 100%;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .modal-box h4 {
            margin: 0 0 8px 0;
            font-size: 17px;
        }

        .modal-box p {
            margin: 0 0 18px 0;
            font-size: 13.5px;
            color: #475569;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Print-safe static spans created inside off-screen PDF clone & print mode */
        .print-text-span {
            display: inline-block;
            vertical-align: bottom;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.15;
        }

        @media screen and (max-width: 820px) {
            body {
                padding: 8px;
            }

            .control-bar {
                padding: 10px;
                gap: 8px;
            }

            .btn {
                padding: 9px 8px;
                font-size: 12px;
            }
        }

        /* Strict 1-Page A4 Print Styles (Prevents Page 2 Spill on iOS Safari & Android Chrome) */
        @page {
            size: A4 portrait;
            margin: 0mm !important;
        }

        @media print {
            html, body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: hidden !important;
            }

            .no-print {
                display: none !important;
            }

            .page-viewport {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }

            .a4-page {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 210mm !important;
                height: auto !important;
                max-height: 276mm !important;
                padding: 6mm 8mm !important;
                margin: 0 auto !important;
                box-shadow: none !important;
                transform: none !important;
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                column-gap: 7mm !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .a4-page::after {
                display: none !important;
            }

            .marksheet {
                display: flex !important;
            }

            table.main-table th,
            table.main-table td {
                height: 21px !important;
            }

            table.main-table thead th {
                height: 18px !important;
            }

            table.sig-table td {
                padding: 1.5px 0 !important;
            }

            .sig-input,
            .date-input {
                border-bottom: none !important;
            }

            .session-select {
                border-bottom: none !important;
                -webkit-appearance: none !important;
                appearance: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Top Toolbar (Download PDF, Print, Clear) -->
    <div class="control-bar no-print">
        <div class="control-group">
            <button type="button" class="btn btn-download" id="downloadPdfBtn" onclick="downloadPDFFile()">
                📄 Download PDF
            </button>
            <button type="button" class="btn btn-print" onclick="printMarkSheet()">
                🖨️ Print
            </button>
            <button type="button" class="btn btn-clear" onclick="openClearModal()">
                🗑️ Clear
            </button>
        </div>
    </div>

    <!-- View Mode Switcher (Fit A4 to Screen vs Easy Entry Zoom) -->
    <div class="mobile-mode-bar no-print">
        <button type="button" class="mode-tab active" id="tabPreviewMode" onclick="setMobileViewMode('preview')">
            📄 Fit A4 to Screen (2-in-1)
        </button>
        <button type="button" class="mode-tab" id="tabEntryMode" onclick="setMobileViewMode('entry')">
            🔍 Easy Entry Zoom
        </button>
    </div>

    <!-- Sheet Selector (Visible only when in Easy Entry Zoom Mode) -->
    <div class="mobile-sheet-tabs no-print" id="mobileSheetTabs">
        <button type="button" class="sheet-tab-btn active" id="btnSheet1" onclick="selectMobileSheet(1)">
            ORIGINAL
        </button>
        <button type="button" class="sheet-tab-btn" id="btnSheet2" onclick="selectMobileSheet(2)">
            DUPLICATE
        </button>
    </div>

    <!-- Responsive Viewport Wrapper -->
    <div class="page-viewport" id="pageViewport">
        <!-- Single A4 Page with Two Side-by-Side Mark Sheets -->
        <div class="a4-page" id="a4Container">
            <!-- Left (ORIGINAL) and Right (DUPLICATE) Mark Sheets are injected here -->
        </div>
    </div>

    <!-- Custom Clear Confirmation Modal -->
    <div class="modal-overlay no-print" id="clearModal">
        <div class="modal-box">
            <h4>Clear All Entries?</h4>
            <p>This will erase all QP Code, Course, Register Numbers, Marks, and Examiner details from both mark sheets.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" onclick="closeClearModal()">Cancel</button>
                <button type="button" class="btn btn-clear" onclick="confirmClearAll()">Yes, Clear</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_ROWS = 25;

        const digitWordMap = {
            '0': 'ZERO',
            '1': 'ONE',
            '2': 'TWO',
            '3': 'THREE',
            '4': 'FOUR',
            '5': 'FIVE',
            '6': 'SIX',
            '7': 'SEVEN',
            '8': 'EIGHT',
            '9': 'NINE',
            '.': 'POINT'
        };

        // Shared offscreen canvas context for accurate text width measurement
        const measureCanvas = document.createElement('canvas');
        const measureCtx = measureCanvas.getContext('2d');

        // Converts "20" -> "TWO ZERO", "08" -> "ZERO EIGHT", "AB" -> "ABSENT"
        function figuresToWords(rawVal) {
            const val = rawVal.trim().toUpperCase();
            if (!val) return '';
            if (val === 'AB' || val === 'ABSENT' || val === 'A') {
                return 'ABSENT';
            }

            const words = [];
            for (const ch of val) {
                if (digitWordMap[ch]) {
                    words.push(digitWordMap[ch]);
                }
            }
            return words.join(' ');
        }

        /*
         * Dynamically shrinks font-size (from maxPx down to minPx) so long text fits inside targetWidth.
         * For Course fields (.course-textarea), if the text is still wider than the line at minPx (7.5px),
         * it automatically enables clean 2-line wrapping so not a single character is ever cut off!
         */
        function fitTextToWidth(el, maxPx = 10.5, minPx = 7.2, fontWeight = '600') {
            if (!el) return;
            const text = (el.value || '').trim();
            const isCourse = el.classList.contains('course-textarea');

            // Use exact A4 column target widths so calculation works even when mobile-entry-mode is active
            let availableW = el.clientWidth - 6;
            if (availableW <= 40) {
                availableW = isCourse ? 320 : 185;
            } else {
                // Clamp to A4 column width so Easy Entry wide view doesn't overestimate A4 width
                const a4MaxW = isCourse ? 322 : 192;
                availableW = Math.min(availableW, a4MaxW);
            }

            if (!text) {
                el.style.fontSize = `${maxPx}px`;
                if (isCourse) {
                    el.classList.remove('multiline');
                    el.style.height = '15px';
                }
                return;
            }

            let chosenSize = maxPx;
            while (chosenSize > minPx) {
                measureCtx.font = `${fontWeight} ${chosenSize}px Arial, Helvetica, sans-serif`;
                if (measureCtx.measureText(text).width <= availableW) {
                    break;
                }
                chosenSize = Math.round((chosenSize - 0.3) * 10) / 10;
            }

            el.style.fontSize = `${chosenSize}px`;

            if (isCourse) {
                measureCtx.font = `${fontWeight} ${chosenSize}px Arial, Helvetica, sans-serif`;
                const textW = measureCtx.measureText(text).width;
                if (textW > availableW) {
                    // Wrap cleanly onto 2 lines if still wider than 1 line at 7.2px
                    el.classList.add('multiline');
                    el.style.height = 'auto';
                    el.style.height = `${Math.min(el.scrollHeight, 26)}px`;
                } else {
                    el.classList.remove('multiline');
                    el.style.height = '15px';
                }
            }
        }

        function autoFitAllHeaderFields() {
            document.querySelectorAll('[data-field="exam-name"]').forEach(el => {
                fitTextToWidth(el, 10.5, 7.0, '600');
            });
            document.querySelectorAll('[data-field="course"]').forEach(el => {
                fitTextToWidth(el, 10.5, 7.2, '600');
            });
        }

        // Build the HTML for a single Mark Sheet column (1 = ORIGINAL, 2 = DUPLICATE)
        function createMarkSheetHTML(sheetIndex) {
            let rowsHTML = '';
            for (let r = 0; r < TOTAL_ROWS; r++) {
                rowsHTML += `
                    <tr>
                        <td>
                            <input type="text" class="cell-input reg-input"
                                data-sheet="${sheetIndex}" data-field="reg-${r}" data-row="${r}" data-col="reg"
                                autocomplete="off" spellcheck="false">
                        </td>
                        <td>
                            <input type="text" class="cell-input fig-input"
                                data-sheet="${sheetIndex}" data-field="fig-${r}" data-row="${r}" data-col="fig"
                                autocomplete="off" spellcheck="false">
                        </td>
                        <td>
                            <input type="text" class="cell-input words-input"
                                data-sheet="${sheetIndex}" data-field="words-${r}" data-row="${r}" data-col="words"
                                autocomplete="off" spellcheck="false">
                        </td>
                    </tr>
                `;
            }

            const badgeLabel = sheetIndex === 1 ? 'ORIGINAL' : 'DUPLICATE';

            return `
                <div class="marksheet" id="sheet-${sheetIndex}">
                    <div class="top-meta-row">
                        <div class="qp-box">
                            <span class="qp-label">QP CODE :</span>
                            <input type="text" class="qp-input" data-sheet="${sheetIndex}" data-field="qp-code" autocomplete="off" spellcheck="false">
                        </div>
                        <span class="sheet-badge">${badgeLabel}</span>
                    </div>

                    <div class="header">
                        <h2>UNIVERSITY OF CALICUT</h2>
                        <h3>MARK SHEET</h3>
                    </div>

                    <div class="meta-line">
                        <input type="text" class="line-input exam-prefix-input" data-sheet="${sheetIndex}" data-field="exam-name" autocomplete="off" spellcheck="false">
                        <span>Examinations</span>
                        <input type="text" class="line-input exam-mid-input" value="November" data-sheet="${sheetIndex}" data-field="exam-session" autocomplete="off" spellcheck="false">
                        <span>20</span>
                        <input type="text" class="line-input exam-year-input" value="26" maxlength="2" data-sheet="${sheetIndex}" data-field="exam-year" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="course-meta-line">
                        <span class="course-label">Course</span>
                        <div class="course-input-wrap">
                            <textarea rows="1" class="course-textarea" data-sheet="${sheetIndex}" data-field="course" autocomplete="off" spellcheck="false"></textarea>
                        </div>
                    </div>

                    <table class="main-table">
                        <thead>
                            <tr>
                                <th rowspan="2" class="col-reg">Register Number</th>
                                <th colspan="2">Marks</th>
                            </tr>
                            <tr>
                                <th class="col-fig">Figures</th>
                                <th class="col-words">in words</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHTML}
                            <tr>
                                <td class="total-label">TOTAL</td>
                                <td>
                                    <input type="text" class="cell-input fig-input"
                                        data-sheet="${sheetIndex}" data-field="total-fig" data-row="25" data-col="fig"
                                        autocomplete="off" spellcheck="false">
                                </td>
                                <td>
                                    <input type="text" class="cell-input words-input"
                                        data-sheet="${sheetIndex}" data-field="total-words" data-row="25" data-col="words"
                                        autocomplete="off" spellcheck="false">
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <table class="sig-table">
                        <tr>
                            <td class="sig-label"></td>
                            <td class="sig-colon"></td>
                            <td class="sig-header-cell sig-name-col">Name</td>
                            <td class="sig-header-cell sig-sign-col">Signature</td>
                        </tr>
                        <tr>
                            <td class="sig-label">Addl. Examiner</td>
                            <td class="sig-colon">:</td>
                            <td class="sig-name-col">
                                <input type="text" class="sig-input" data-sheet="${sheetIndex}" data-field="addl-examiner" autocomplete="off" spellcheck="false">
                            </td>
                            <td class="sig-sign-col"></td>
                        </tr>
                        <tr>
                            <td class="sig-label">Chief Examiner</td>
                            <td class="sig-colon">:</td>
                            <td class="sig-name-col">
                                <input type="text" class="sig-input" data-sheet="${sheetIndex}" data-field="chief-examiner" autocomplete="off" spellcheck="false">
                            </td>
                            <td class="sig-sign-col"></td>
                        </tr>
                        <tr>
                            <td class="sig-label">Chairman</td>
                            <td class="sig-colon">:</td>
                            <td class="sig-name-col">
                                <input type="text" class="sig-input" data-sheet="${sheetIndex}" data-field="chairman" autocomplete="off" spellcheck="false">
                            </td>
                            <td class="sig-sign-col"></td>
                        </tr>
                        <tr>
                            <td class="sig-label">Date</td>
                            <td class="sig-colon">:</td>
                            <td colspan="2">
                                <div class="date-session-wrapper">
                                    <input type="text" class="date-input" data-sheet="${sheetIndex}" data-field="date" autocomplete="off" spellcheck="false">
                                    <div class="session-box">
                                        <span>SESSION :</span>
                                        <select class="session-select" data-sheet="${sheetIndex}" data-field="session-fn-an">
                                            <option value="FN / AN">FN / AN</option>
                                            <option value="FN">FN</option>
                                            <option value="AN">AN</option>
                                        </select>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            `;
        }

        // Render both side-by-side sheets
        const a4Container = document.getElementById('a4Container');
        a4Container.innerHTML = createMarkSheetHTML(1) + createMarkSheetHTML(2);
        document.getElementById('sheet-1').classList.add('mobile-active-sheet');

        // Prevent Enter key from creating manual linebreaks inside the Course textarea
        a4Container.querySelectorAll('.course-textarea').forEach(ta => {
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            });
        });

        // Silently mirror all fields from Sheet 1 (ORIGINAL) to Sheet 2 (DUPLICATE)
        function syncAllFromOriginalToDuplicate() {
            const sheet1Fields = document.querySelectorAll('[data-sheet="1"]');
            sheet1Fields.forEach(el1 => {
                const field = el1.getAttribute('data-field');
                const el2 = document.querySelector(`[data-sheet="2"][data-field="${field}"]`);
                if (el2) {
                    el2.value = el1.value;
                }
            });
            autoFitAllHeaderFields();
        }

        // Live input handler: converts Figures -> Words per student row; leaves TOTAL row untouched
        function handleFieldChange(e) {
            const target = e.target;
            if (target.tagName !== 'INPUT' && target.tagName !== 'SELECT' && target.tagName !== 'TEXTAREA') return;

            const sheetIndex = target.getAttribute('data-sheet');
            const row = target.getAttribute('data-row');
            const col = target.getAttribute('data-col');
            const field = target.getAttribute('data-field');

            // Convert student rows (0 to 24); do not auto-sum or fill TOTAL row (row 25)
            if (col === 'fig' && row !== null && parseInt(row, 10) < TOTAL_ROWS) {
                const wordsEl = document.querySelector(`input[data-sheet="${sheetIndex}"][data-field="words-${row}"]`);
                if (wordsEl) {
                    wordsEl.value = figuresToWords(target.value);
                }
            }

            if (field === 'exam-name' || field === 'course') {
                autoFitAllHeaderFields();
            }

            // Whenever ORIGINAL is edited, silently mirror to DUPLICATE
            if (sheetIndex === '1') {
                syncAllFromOriginalToDuplicate();
            }
        }

        a4Container.addEventListener('input', handleFieldChange);
        a4Container.addEventListener('change', handleFieldChange);

        // Keyboard navigation (Enter / ArrowDown / ArrowUp)
        a4Container.addEventListener('keydown', (e) => {
            const target = e.target;
            if (target.tagName !== 'INPUT') return;

            const sheetIndex = target.getAttribute('data-sheet');
            const rowStr = target.getAttribute('data-row');
            const col = target.getAttribute('data-col');

            if (rowStr === null || !col) return;
            const row = parseInt(rowStr, 10);

            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault();
                const nextRow = row + 1;
                const nextInput = document.querySelector(`input[data-sheet="${sheetIndex}"][data-row="${nextRow}"][data-col="${col}"]`);
                if (nextInput) nextInput.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prevRow = row - 1;
                if (prevRow >= 0) {
                    const prevInput = document.querySelector(`input[data-sheet="${sheetIndex}"][data-row="${prevRow}"][data-col="${col}"]`);
                    if (prevInput) prevInput.focus();
                }
            }
        });

        // Build dynamic filename from QP CODE + DATE -> [QP_CODE]_[DATE]
        function getDynamicFileName() {
            const qpInput = document.querySelector('[data-sheet="1"][data-field="qp-code"]');
            const dateInput = document.querySelector('[data-sheet="1"][data-field="date"]');

            const rawQp = (qpInput && qpInput.value.trim()) ? qpInput.value.trim() : 'QPCODE';
            const rawDate = (dateInput && dateInput.value.trim()) ? dateInput.value.trim() : 'DATE';

            const cleanQp = rawQp.replace(/[^a-zA-Z0-9_-]/g, '_');
            const cleanDate = rawDate.replace(/[^a-zA-Z0-9_-]/g, '-');

            return `${cleanQp}_${cleanDate}`;
        }

        // Print A4 Page (Guaranteed 1 Page)
        function printMarkSheet() {
            syncAllFromOriginalToDuplicate();
            const originalTitle = document.title;
            document.title = getDynamicFileName();
            window.print();
            setTimeout(() => {
                document.title = originalTitle;
            }, 1000);
        }

        /*
         * Builds an off-screen, unscaled A4 clone where every <input>, <textarea>, and <select>
         * is converted into a crisp static <div>/<span> with auto-fitted font sizes so html2canvas
         * NEVER clips long Course or Semester names and always renders both ORIGINAL & DUPLICATE side-by-side.
         */
        async function downloadPDFFile() {
            const btn = document.getElementById('downloadPdfBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Generating PDF...';
            btn.disabled = true;

            let offscreenWrapper = null;

            try {
                syncAllFromOriginalToDuplicate();

                // Create an off-screen wrapper with fixed A4 geometry (immune to mobile zoom/scaling)
                offscreenWrapper = document.createElement('div');
                offscreenWrapper.style.position = 'fixed';
                offscreenWrapper.style.left = '-9999px';
                offscreenWrapper.style.top = '0';
                offscreenWrapper.style.width = '794px';
                offscreenWrapper.style.height = '1123px';
                offscreenWrapper.style.backgroundColor = '#ffffff';
                offscreenWrapper.style.zIndex = '-1';

                const clonePage = a4Container.cloneNode(true);
                clonePage.style.transform = 'none';
                clonePage.style.width = '794px';
                clonePage.style.minWidth = '794px';
                clonePage.style.height = '1123px';
                clonePage.style.padding = '20px 24px';
                clonePage.style.boxShadow = 'none';
                clonePage.style.display = 'grid';
                clonePage.style.gridTemplateColumns = '1fr 1fr';
                clonePage.style.columnGap = '24px';

                // Ensure both sheets are visible inside the clone even if mobile Easy Entry mode is active
                clonePage.querySelectorAll('.marksheet').forEach(sheet => {
                    sheet.style.display = 'flex';
                });

                offscreenWrapper.appendChild(clonePage);
                document.body.appendChild(offscreenWrapper);

                // Replace all <input>, <textarea>, and <select> elements in the clone with crisp print-safe divs
                const origControls = a4Container.querySelectorAll('input, textarea, select');
                const cloneControls = clonePage.querySelectorAll('input, textarea, select');

                cloneControls.forEach((cloneEl, idx) => {
                    const origEl = origControls[idx];
                    const val = origEl ? origEl.value : '';
                    const field = cloneEl.getAttribute('data-field') || '';
                    const span = document.createElement('div');

                    // Copy computed font size from the live auto-fitted element
                    const computed = window.getComputedStyle(origEl);
                    span.style.fontFamily = 'Arial, Helvetica, sans-serif';
                    span.style.fontSize = computed.fontSize;
                    span.style.fontWeight = computed.fontWeight;
                    span.style.color = '#000000';
                    span.style.textAlign = computed.textAlign;
                    span.style.textTransform = computed.textTransform;
                    span.style.lineHeight = '1.15';
                    span.style.boxSizing = 'border-box';

                    if (field === 'course') {
                        span.style.width = '100%';
                        span.style.minHeight = '15px';
                        span.style.padding = '0 2px 1px 2px';
                        span.style.fontWeight = '600';
                        span.style.whiteSpace = origEl.classList.contains('multiline') ? 'normal' : 'nowrap';
                        span.style.wordBreak = 'break-word';
                        span.textContent = val;
                    } else if (field === 'exam-name') {
                        span.style.flex = '1 1 auto';
                        span.style.minWidth = '0';
                        span.style.borderBottom = '1.2px solid #000000';
                        span.style.minHeight = '15px';
                        span.style.padding = '0 2px 1px 2px';
                        span.style.textAlign = 'center';
                        span.style.fontWeight = '600';
                        span.style.whiteSpace = 'nowrap';
                        span.textContent = val;
                    } else if (cloneEl.classList.contains('line-input') || cloneEl.classList.contains('qp-input')) {
                        span.style.width = computed.width;
                        span.style.borderBottom = '1.2px solid #000000';
                        span.style.minHeight = '15px';
                        span.style.padding = '0 2px 1px 2px';
                        span.style.whiteSpace = 'nowrap';
                        span.textContent = val;
                    } else if (cloneEl.classList.contains('cell-input')) {
                        span.style.width = '100%';
                        span.style.height = '100%';
                        span.style.display = 'flex';
                        span.style.alignItems = 'center';
                        span.style.justifyContent = 'center';
                        span.style.padding = '0 2px';
                        span.textContent = val;
                    } else if (cloneEl.classList.contains('sig-input') || cloneEl.classList.contains('date-input')) {
                        span.style.width = computed.width;
                        span.style.minHeight = '15px';
                        span.style.padding = '0 2px';
                        span.style.whiteSpace = 'nowrap';
                        span.textContent = val;
                    } else if (cloneEl.classList.contains('session-select')) {
                        span.style.display = 'inline-block';
                        span.style.fontWeight = '700';
                        span.style.fontSize = '10.5px';
                        span.textContent = val || 'FN / AN';
                    }

                    cloneEl.parentNode.replaceChild(span, cloneEl);
                });

                // Hide the center dashed screen guide line inside the PDF clone
                const styleTag = document.createElement('style');
                styleTag.textContent = `#${clonePage.id}::after { display: none !important; }`;
                offscreenWrapper.appendChild(styleTag);

                const canvas = await html2canvas(clonePage, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    width: 794,
                    height: 1123,
                    windowWidth: 794,
                    windowHeight: 1123
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                pdf.save(`${getDynamicFileName()}.pdf`);
            } catch (err) {
                console.error('PDF export error:', err);
                printMarkSheet();
            } finally {
                if (offscreenWrapper && offscreenWrapper.parentNode) {
                    offscreenWrapper.parentNode.removeChild(offscreenWrapper);
                }
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Responsive Mobile Scaling: Default is 'preview' (Fit Full A4 Side-by-Side to Screen)
        let currentMobileMode = 'preview';

        function setMobileViewMode(mode) {
            currentMobileMode = mode;
            const tabEntry = document.getElementById('tabEntryMode');
            const tabPreview = document.getElementById('tabPreviewMode');

            if (mode === 'entry') {
                document.body.classList.add('mobile-entry-mode');
                tabEntry.classList.add('active');
                tabPreview.classList.remove('active');
            } else {
                document.body.classList.remove('mobile-entry-mode');
                tabEntry.classList.remove('active');
                tabPreview.classList.add('active');
            }
            applyMobileScaling();
            autoFitAllHeaderFields();
        }

        function selectMobileSheet(sheetNum) {
            const s1 = document.getElementById('sheet-1');
            const s2 = document.getElementById('sheet-2');
            const b1 = document.getElementById('btnSheet1');
            const b2 = document.getElementById('btnSheet2');

            if (sheetNum === 1) {
                s1.classList.add('mobile-active-sheet');
                s2.classList.remove('mobile-active-sheet');
                b1.classList.add('active');
                b2.classList.remove('active');
            } else {
                s1.classList.remove('mobile-active-sheet');
                s2.classList.add('mobile-active-sheet');
                b1.classList.remove('active');
                b2.classList.add('active');
            }
            autoFitAllHeaderFields();
        }

        function applyMobileScaling() {
            const viewport = document.getElementById('pageViewport');
            if (currentMobileMode === 'entry') {
                document.body.classList.add('mobile-entry-mode');
                a4Container.style.transform = 'none';
                viewport.style.height = 'auto';
                return;
            }

            document.body.classList.remove('mobile-entry-mode');
            const availableWidth = document.documentElement.clientWidth - 16;
            const a4PixelWidth = 794;

            if (availableWidth < a4PixelWidth) {
                const scale = availableWidth / a4PixelWidth;
                a4Container.style.transform = `scale(${scale})`;
                viewport.style.height = `${Math.ceil(1065 * scale) + 12}px`;
            } else {
                a4Container.style.transform = 'none';
                viewport.style.height = 'auto';
            }
        }

        window.addEventListener('resize', () => {
            applyMobileScaling();
            autoFitAllHeaderFields();
        });
        window.addEventListener('DOMContentLoaded', () => {
            applyMobileScaling();
            autoFitAllHeaderFields();
        });
        applyMobileScaling();
        autoFitAllHeaderFields();

        // Modal Controls for Clear All
        function openClearModal() {
            document.getElementById('clearModal').classList.add('active');
        }

        function closeClearModal() {
            document.getElementById('clearModal').classList.remove('active');
        }

        function confirmClearAll() {
            const allInputs = a4Container.querySelectorAll('input, textarea');
            allInputs.forEach(inp => {
                const field = inp.getAttribute('data-field');
                if (field === 'exam-session') {
                    inp.value = 'November';
                } else if (field === 'exam-year') {
                    inp.value = '26';
                } else {
                    inp.value = '';
                }
            });
            const allSelects = a4Container.querySelectorAll('select');
            allSelects.forEach(sel => { sel.selectedIndex = 0; });
            autoFitAllHeaderFields();
            closeClearModal();
        }
    </script>
</body>
</html>
