<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>University of Calicut - Interactive Mark Sheet</title>
    <!-- jsPDF for 100% reliable, cutoff-free side-by-side A4 PDF generation on mobile & desktop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #cbd5e1;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000000;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Control Bar (Hidden in Print) */
        .control-bar {
            background: #0f172a;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            width: 794px;
            max-width: 100%;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            font-size: 13px;
            z-index: 20;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
        }

        .btn {
            border: none;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
            font-family: inherit;
            flex: 1;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-download {
            background-color: #059669;
            color: #ffffff;
        }

        .btn-print {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-clear {
            background-color: #dc2626;
            color: #ffffff;
        }

        .btn-cancel {
            background-color: #64748b;
            color: #ffffff;
        }

        /* Mobile View Switcher Bar */
        .mobile-mode-bar {
            display: flex;
            width: 794px;
            max-width: 100%;
            background: #1e293b;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 12px;
            gap: 6px;
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 8px 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: #cbd5e1;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .mode-tab.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        /* Sheet Switcher inside Easy Entry Zoom Mode */
        .mobile-sheet-tabs {
            display: none;
            width: 794px;
            max-width: 100%;
            gap: 8px;
            margin-bottom: 10px;
        }

        .sheet-tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 12.5px;
            font-weight: 700;
            border: 1.5px solid #475569;
            background: #e2e8f0;
            color: #1e293b;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .sheet-tab-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        /* Viewport Wrapper for Smooth A4 Scaling on Mobile */
        .page-viewport {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Exact A4 Portrait Page (794px x 1123px at 96 DPI = 210mm x 297mm) */
        .a4-page {
            background: #ffffff;
            width: 794px;
            min-width: 794px;
            height: 1123px;
            padding: 24px 26px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 28px;
            align-items: start;
            position: relative;
            transform-origin: top center;
            color: #000000;
        }

        /* Subtle center guide line on screen only */
        .a4-page::after {
            content: "";
            position: absolute;
            top: 16px;
            bottom: 16px;
            left: 50%;
            border-left: 1px dashed #cbd5e1;
            pointer-events: none;
        }

        /* Individual Mark Sheet Column */
        .marksheet {
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            color: #000000;
        }

        /* Top Row: QP CODE on Left, ORIGINAL / DUPLICATE on Right */
        .top-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
        }

        .qp-box {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
        }

        .qp-label {
            color: #000000;
            font-weight: 700;
            font-size: 11.5px;
        }

        .qp-input {
            border: none;
            border-bottom: 1px solid #000000;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            width: 115px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11.5px;
            font-weight: 700;
            color: #000000;
            padding: 0 2px;
            height: 16px;
        }

        .sheet-badge {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #000000;
            text-transform: uppercase;
        }

        /* Centered University Header */
        .header {
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.25;
        }

        .header h2 {
            margin: 0;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .header h3 {
            margin: 3px 0 0 0;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* Single-Line Examinations & Course Rows */
        .meta-line {
            display: flex;
            align-items: baseline;
            width: 100%;
            white-space: nowrap;
            font-size: 12px;
            margin-bottom: 5px;
            color: #000000;
        }

        .line-input {
            border: none;
            border-bottom: 1px solid #000000;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11.5px;
            color: #000000;
            padding: 0 3px;
            height: 16px;
            min-width: 0;
        }

        .exam-prefix-input {
            flex: 1;
            text-align: center;
        }

        .exam-mid-input {
            width: 48px;
            text-align: center;
        }

        .exam-year-input {
            width: 26px;
            text-align: left;
        }

        .course-input {
            flex: 1;
            margin-left: 2px;
        }

        /* Main Marks Table - Strict Connected Black Grid */
        table.main-table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #000000;
            table-layout: fixed;
            margin-top: 2px;
            margin-bottom: 6px;
        }

        table.main-table th,
        table.main-table td {
            border: 1px solid #000000;
            padding: 0;
            margin: 0;
            height: 26.5px;
            vertical-align: middle;
            text-align: center;
            font-size: 11.5px;
            color: #000000;
        }

        table.main-table thead th {
            font-weight: 400;
            height: 22px;
            background: transparent;
        }

        .col-reg {
            width: 38%;
        }

        .col-fig {
            width: 20%;
        }

        .col-words {
            width: 42%;
        }

        /* Seamless Borderless Inputs inside Table Cells */
        .cell-input {
            width: 100%;
            height: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            background: transparent !important;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11.5px;
            color: #000000;
            padding: 0 4px;
            margin: 0;
            display: block;
            text-align: center;
        }

        .reg-input {
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .fig-input {
            text-transform: uppercase;
            font-weight: 700;
        }

        .words-input {
            text-transform: uppercase;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.1px;
        }

        .cell-input:focus,
        .line-input:focus,
        .qp-input:focus,
        .sig-input:focus,
        .date-input:focus {
            background-color: rgba(59, 130, 246, 0.08) !important;
        }

        .total-label {
            text-align: left !important;
            padding-left: 5px !important;
            font-weight: 700;
            font-size: 11.5px;
            letter-spacing: 0.3px;
        }

        /* Bottom Examiner Signature Section */
        table.sig-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 2px;
        }

        table.sig-table td {
            border: none;
            padding: 3px 0;
            vertical-align: bottom;
            font-size: 11.5px;
            color: #000000;
        }

        .sig-label {
            width: 31%;
            font-weight: 700;
            font-style: italic;
            white-space: nowrap;
        }

        .sig-colon {
            width: 4%;
            font-weight: 700;
            text-align: center;
        }

        .sig-name-col {
            width: 35%;
            padding-right: 6px !important;
        }

        .sig-sign-col {
            width: 30%;
        }

        .sig-header-cell {
            text-align: center;
            text-decoration: underline;
            font-size: 11.5px;
            padding-bottom: 4px !important;
        }

        .sig-input {
            width: 100%;
            border: none;
            border-bottom: 1px dotted #64748b;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #000000;
            height: 17px;
            padding: 0 2px;
        }

        .date-session-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
        }

        .date-input {
            width: 95px;
            border: none;
            border-bottom: 1px dotted #64748b;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #000000;
            height: 17px;
            padding: 0 2px;
        }

        .session-box {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 700;
        }

        .session-select {
            border: none;
            border-bottom: 1px solid #000000;
            background: transparent;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 700;
            padding: 0 2px;
            outline: none;
            cursor: pointer;
        }

        /* Easy Entry Zoom Mode (Single Sheet Full Width for Comfortable Mobile Typing) */
        body.mobile-entry-mode .mobile-sheet-tabs {
            display: flex;
        }

        body.mobile-entry-mode .a4-page {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 540px !important;
            height: auto !important;
            padding: 14px !important;
            display: block !important;
            transform: none !important;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        body.mobile-entry-mode .a4-page::after {
            display: none;
        }

        body.mobile-entry-mode .marksheet {
            display: none;
        }

        body.mobile-entry-mode .marksheet.mobile-active-sheet {
            display: flex;
        }

        body.mobile-entry-mode table.main-table th,
        body.mobile-entry-mode table.main-table td {
            height: 32px;
            font-size: 13px;
        }

        body.mobile-entry-mode .cell-input {
            font-size: 13.5px;
        }

        body.mobile-entry-mode .words-input {
            font-size: 11.5px;
        }

        /* Clear Confirmation Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            color: #0f172a;
            max-width: 360px;
            width: 100%;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .modal-box h4 {
            margin: 0 0 8px 0;
            font-size: 17px;
        }

        .modal-box p {
            margin: 0 0 18px 0;
            font-size: 13.5px;
            color: #475569;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        @media screen and (max-width: 820px) {
            body {
                padding: 8px;
            }

            .control-bar {
                padding: 10px;
                gap: 8px;
            }

            .btn {
                padding: 9px 8px;
                font-size: 12px;
            }
        }

        /* Strict A4 Print Styles */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            html, body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                overflow: visible !important;
            }

            .no-print {
                display: none !important;
            }

            .page-viewport {
                width: 210mm !important;
                height: 297mm !important;
                overflow: visible !important;
            }

            .a4-page {
                width: 210mm !important;
                min-width: 210mm !important;
                height: 297mm !important;
                padding: 7mm 7mm !important;
                box-shadow: none !important;
                transform: none !important;
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                column-gap: 8mm !important;
                margin: 0 !important;
            }

            .a4-page::after {
                display: none !important;
            }

            .marksheet {
                display: flex !important;
            }

            .sig-input,
            .date-input {
                border-bottom: none !important;
            }

            .session-select {
                border-bottom: none !important;
                -webkit-appearance: none !important;
                appearance: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Top Toolbar (Download PDF, Print A4, Clear All) -->
    <div class="control-bar no-print">
        <div class="control-group">
            <button type="button" class="btn btn-download" id="downloadPdfBtn" onclick="downloadPDFFile()">
                📄 Download PDF
            </button>
            <button type="button" class="btn btn-print" onclick="printMarkSheet()">
                🖨️ Print A4
            </button>
            <button type="button" class="btn btn-clear" onclick="openClearModal()">
                🗑️ Clear All
            </button>
        </div>
    </div>

    <!-- View Mode Switcher (Fit A4 Side-by-Side to Screen vs Easy Entry Zoom) -->
    <div class="mobile-mode-bar no-print">
        <button type="button" class="mode-tab active" id="tabPreviewMode" onclick="setMobileViewMode('preview')">
            📄 Fit A4 to Screen (2-in-1)
        </button>
        <button type="button" class="mode-tab" id="tabEntryMode" onclick="setMobileViewMode('entry')">
            🔍 Easy Entry Zoom (1-by-1)
        </button>
    </div>

    <!-- Sheet Selector (Visible only when in Easy Entry Zoom Mode) -->
    <div class="mobile-sheet-tabs no-print" id="mobileSheetTabs">
        <button type="button" class="sheet-tab-btn active" id="btnSheet1" onclick="selectMobileSheet(1)">
            ORIGINAL
        </button>
        <button type="button" class="sheet-tab-btn" id="btnSheet2" onclick="selectMobileSheet(2)">
            DUPLICATE
        </button>
    </div>

    <!-- Responsive Viewport Wrapper -->
    <div class="page-viewport" id="pageViewport">
        <!-- Single A4 Page with Two Side-by-Side Mark Sheets -->
        <div class="a4-page" id="a4Container">
            <!-- Left (ORIGINAL) and Right (DUPLICATE) Mark Sheets are injected here -->
        </div>
    </div>

    <!-- Custom Clear Confirmation Modal -->
    <div class="modal-overlay no-print" id="clearModal">
        <div class="modal-box">
            <h4>Clear All Entries?</h4>
            <p>This will erase all QP Code, Register Numbers, Marks, and Examiner details from both mark sheets.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" onclick="closeClearModal()">Cancel</button>
                <button type="button" class="btn btn-clear" onclick="confirmClearAll()">Yes, Clear</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_ROWS = 25;

        const digitWordMap = {
            '0': 'ZERO',
            '1': 'ONE',
            '2': 'TWO',
            '3': 'THREE',
            '4': 'FOUR',
            '5': 'FIVE',
            '6': 'SIX',
            '7': 'SEVEN',
            '8': 'EIGHT',
            '9': 'NINE',
            '.': 'POINT'
        };

        // Converts "20" -> "TWO ZERO", "08" -> "ZERO EIGHT", "AB" -> "ABSENT"
        function figuresToWords(rawVal) {
            const val = rawVal.trim().toUpperCase();
            if (!val) return '';
            if (val === 'AB' || val === 'ABSENT' || val === 'A') {
                return 'ABSENT';
            }

            const words = [];
            for (const ch of val) {
                if (digitWordMap[ch]) {
                    words.push(digitWordMap[ch]);
                }
            }
            return words.join(' ');
        }

        // Build the HTML for a single Mark Sheet column (1 = ORIGINAL, 2 = DUPLICATE)
        function createMarkSheetHTML(sheetIndex) {
            let rowsHTML = '';
            for (let r = 0; r < TOTAL_ROWS; r++) {
                rowsHTML += `
                    <tr>
                        <td>
                            <input type="text" class="cell-input reg-input"
                                data-sheet="${sheetIndex}" data-field="reg-${r}" data-row="${r}" data-col="reg"
                                autocomplete="off" spellcheck="false">
                        </td>
                        <td>
                            <input type="text" class="cell-input fig-input"
                                data-sheet="${sheetIndex}" data-field="fig-${r}" data-row="${r}" data-col="fig"
                                autocomplete="off" spellcheck="false">
                        </td>
                        <td>
                            <input type="text" class="cell-input words-input"
                                data-sheet="${sheetIndex}" data-field="words-${r}" data-row="${r}" data-col="words"
                                autocomplete="off" spellcheck="false">
                        </td>
                    </tr>
                `;
            }

            const badgeLabel = sheetIndex === 1 ? 'ORIGINAL' : 'DUPLICATE';

            return `
                <div class="marksheet" id="sheet-${sheetIndex}">
                    <div class="top-meta-row">
                        <div class="qp-box">
                            <span class="qp-label">QP CODE :</span>
                            <input type="text" class="qp-input" data-sheet="${sheetIndex}" data-field="qp-code" autocomplete="off" spellcheck="false">
                        </div>
                        <span class="sheet-badge">${badgeLabel}</span>
                    </div>

                    <div class="header">
                        <h2>UNIVERSITY OF CALICUT</h2>
                        <h3>MARK SHEET</h3>
                    </div>

                    <div class="meta-line">
                        <input type="text" class="line-input exam-prefix-input" data-sheet="${sheetIndex}" data-field="exam-name" autocomplete="off" spellcheck="false">
                        <span>Examinations</span>
                        <input type="text" class="line-input exam-mid-input" data-sheet="${sheetIndex}" data-field="exam-session" autocomplete="off" spellcheck="false">
                        <span>20</span>
                        <input type="text" class="line-input exam-year-input" maxlength="2" data-sheet="${sheetIndex}" data-field="exam-year" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="meta-line">
                        <span>Course</span>
                        <input type="text" class="line-input course-input" data-sheet="${sheetIndex}" data-field="course" autocomplete="off" spellcheck="false">
                    </div>

                    <table class="main-table">
                        <thead>
                            <tr>
                                <th rowspan="2" class="col-reg">Register Number</th>
                                <th colspan="2">Marks</th>
                            </tr>
                            <tr>
                                <th class="col-fig">Figures</th>
                                <th class="col-words">in words</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHTML}
                            <tr>
                                <td class="total-label">TOTAL</td>
                                <td>
                                    <input type="text" class="cell-input fig-input"
                                        data-sheet="${sheetIndex}" data-field="total-fig" data-row="25" data-col="fig"
                                        autocomplete="off" spellcheck="false">
                                </td>
                                <td>
                                    <input type="text" class="cell-input words-input"
                                        data-sheet="${sheetIndex}" data-field="total-words" data-row="25" data-col="words"
                                        autocomplete="off" spellcheck="false">
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <table class="sig-table">
                        <tr>
                            <td class="sig-label"></td>
                            <td class="sig-colon"></td>
                            <td class="sig-header-cell sig-name-col">Name</td>
                            <td class="sig-header-cell sig-sign-col">Signature</td>
                        </tr>
                        <tr>
                            <td class="sig-label">Addl. Examiner</td>
                            <td class="sig-colon">:</td>
                            <td class="sig-name-col">
                                <input type="text" class="sig-input" data-sheet="${sheetIndex}" data-field="addl-examiner" autocomplete="off" spellcheck="false">
                            </td>
                            <td class="sig-sign-col"></td>
                        </tr>
                        <tr>
                            <td class="sig-label">Chief Examiner</td>
                            <td class="sig-colon">:</td>
                            <td class="sig-name-col">
                                <input type="text" class="sig-input" data-sheet="${sheetIndex}" data-field="chief-examiner" autocomplete="off" spellcheck="false">
                            </td>
                            <td class="sig-sign-col"></td>
                        </tr>
                        <tr>
                            <td class="sig-label">Chairman</td>
                            <td class="sig-colon">:</td>
                            <td class="sig-name-col">
                                <input type="text" class="sig-input" data-sheet="${sheetIndex}" data-field="chairman" autocomplete="off" spellcheck="false">
                            </td>
                            <td class="sig-sign-col"></td>
                        </tr>
                        <tr>
                            <td class="sig-label">Date</td>
                            <td class="sig-colon">:</td>
                            <td colspan="2">
                                <div class="date-session-wrapper">
                                    <input type="text" class="date-input" data-sheet="${sheetIndex}" data-field="date" autocomplete="off" spellcheck="false">
                                    <div class="session-box">
                                        <span>SESSION :</span>
                                        <select class="session-select" data-sheet="${sheetIndex}" data-field="session-fn-an">
                                            <option value="FN / AN">FN / AN</option>
                                            <option value="FN">FN</option>
                                            <option value="AN">AN</option>
                                        </select>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            `;
        }

        // Render both side-by-side sheets
        const a4Container = document.getElementById('a4Container');
        a4Container.innerHTML = createMarkSheetHTML(1) + createMarkSheetHTML(2);
        document.getElementById('sheet-1').classList.add('mobile-active-sheet');

        // Silently mirror all fields from Sheet 1 (ORIGINAL) to Sheet 2 (DUPLICATE)
        function syncAllFromOriginalToDuplicate() {
            const sheet1Fields = document.querySelectorAll('[data-sheet="1"]');
            sheet1Fields.forEach(el1 => {
                const field = el1.getAttribute('data-field');
                const el2 = document.querySelector(`[data-sheet="2"][data-field="${field}"]`);
                if (el2) {
                    el2.value = el1.value;
                }
            });
        }

        // Live input handler: converts Figures -> Words per student row; leaves TOTAL row untouched
        function handleFieldChange(e) {
            const target = e.target;
            if (target.tagName !== 'INPUT' && target.tagName !== 'SELECT') return;

            const sheetIndex = target.getAttribute('data-sheet');
            const row = target.getAttribute('data-row');
            const col = target.getAttribute('data-col');

            // Convert student rows (0 to 24); do not auto-sum or fill TOTAL row (row 25)
            if (col === 'fig' && row !== null && parseInt(row, 10) < TOTAL_ROWS) {
                const wordsEl = document.querySelector(`input[data-sheet="${sheetIndex}"][data-field="words-${row}"]`);
                if (wordsEl) {
                    wordsEl.value = figuresToWords(target.value);
                }
            }

            // Whenever ORIGINAL is edited, silently mirror to DUPLICATE
            if (sheetIndex === '1') {
                syncAllFromOriginalToDuplicate();
            }
        }

        a4Container.addEventListener('input', handleFieldChange);
        a4Container.addEventListener('change', handleFieldChange);

        // Keyboard navigation (Enter / ArrowDown / ArrowUp)
        a4Container.addEventListener('keydown', (e) => {
            const target = e.target;
            if (target.tagName !== 'INPUT') return;

            const sheetIndex = target.getAttribute('data-sheet');
            const rowStr = target.getAttribute('data-row');
            const col = target.getAttribute('data-col');

            if (rowStr === null || !col) return;
            const row = parseInt(rowStr, 10);

            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault();
                const nextRow = row + 1;
                const nextInput = document.querySelector(`input[data-sheet="${sheetIndex}"][data-row="${nextRow}"][data-col="${col}"]`);
                if (nextInput) nextInput.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prevRow = row - 1;
                if (prevRow >= 0) {
                    const prevInput = document.querySelector(`input[data-sheet="${sheetIndex}"][data-row="${prevRow}"][data-col="${col}"]`);
                    if (prevInput) prevInput.focus();
                }
            }
        });

        // Build dynamic filename from QP CODE + DATE -> [QP_CODE]_[DATE]
        function getDynamicFileName() {
            const qpInput = document.querySelector('input[data-sheet="1"][data-field="qp-code"]');
            const dateInput = document.querySelector('input[data-sheet="1"][data-field="date"]');

            const rawQp = (qpInput && qpInput.value.trim()) ? qpInput.value.trim() : 'QPCODE';
            const rawDate = (dateInput && dateInput.value.trim()) ? dateInput.value.trim() : 'DATE';

            const cleanQp = rawQp.replace(/[^a-zA-Z0-9_-]/g, '_');
            const cleanDate = rawDate.replace(/[^a-zA-Z0-9_-]/g, '-');

            return `${cleanQp}_${cleanDate}`;
        }

        // Helper to read a field value from sheet 1 or sheet 2
        function getSheetVal(sheetIndex, fieldName) {
            const el = document.querySelector(`[data-sheet="${sheetIndex}"][data-field="${fieldName}"]`);
            return el ? el.value.trim() : '';
        }

        // Print A4 Page
        function printMarkSheet() {
            const originalTitle = document.title;
            document.title = getDynamicFileName();
            window.print();
            setTimeout(() => {
                document.title = originalTitle;
            }, 1000);
        }

        /*
         * Direct High-Resolution A4 Canvas + jsPDF Renderer
         * Completely immune to CSS scale(), mobile screen width, or scroll offsets.
         * Always draws BOTH ORIGINAL (left) and DUPLICATE (right) side-by-side on 1 A4 page.
         */
        function renderSingleSheetOnCanvas(ctx, sheetIndex, originX, originY, colW) {
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';

            let y = originY;

            // 1. Top Row: QP CODE on left, ORIGINAL / DUPLICATE on right
            ctx.font = 'bold 11.5px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('QP CODE :', originX, y + 12);

            const qpLineStart = originX + 64;
            const qpLineEnd = originX + 185;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(qpLineStart, y + 14);
            ctx.lineTo(qpLineEnd, y + 14);
            ctx.stroke();

            const qpVal = getSheetVal(sheetIndex, 'qp-code');
            if (qpVal) {
                ctx.fillText(qpVal, qpLineStart + 3, y + 12);
            }

            const badgeText = sheetIndex === 1 ? 'ORIGINAL' : 'DUPLICATE';
            ctx.textAlign = 'right';
            ctx.fillText(badgeText, originX + colW, y + 12);

            y += 26;

            // 2. Centered Header: UNIVERSITY OF CALICUT / MARK SHEET
            ctx.textAlign = 'center';
            ctx.font = 'bold 15.5px Arial, Helvetica, sans-serif';
            ctx.fillText('UNIVERSITY OF CALICUT', originX + colW / 2, y + 10);

            y += 20;
            ctx.font = 'bold 14.5px Arial, Helvetica, sans-serif';
            ctx.fillText('MARK SHEET', originX + colW / 2, y + 8);

            y += 22;

            // 3. Examinations Line: __________Examinations_____20___
            ctx.font = 'normal 12px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';

            const examLabel = 'Examinations';
            const examLabelW = ctx.measureText(examLabel).width;
            const yearPrefix = '20';
            const yearPrefixW = ctx.measureText(yearPrefix).width;

            const yearLineW = 26;
            const midLineW = 48;
            const prefixLineW = colW - examLabelW - midLineW - yearPrefixW - yearLineW - 4;

            let curX = originX;
            // Prefix line before Examinations
            ctx.beginPath();
            ctx.moveTo(curX, y + 12);
            ctx.lineTo(curX + prefixLineW, y + 12);
            ctx.stroke();

            const examNameVal = getSheetVal(sheetIndex, 'exam-name');
            if (examNameVal) {
                ctx.font = 'normal 11.5px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(examNameVal, curX + prefixLineW / 2, y + 10);
            }

            curX += prefixLineW + 1;
            ctx.font = 'normal 12px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(examLabel, curX, y + 11);
            curX += examLabelW + 1;

            // Middle line between Examinations and 20
            ctx.beginPath();
            ctx.moveTo(curX, y + 12);
            ctx.lineTo(curX + midLineW, y + 12);
            ctx.stroke();

            const examSessionVal = getSheetVal(sheetIndex, 'exam-session');
            if (examSessionVal) {
                ctx.font = 'normal 11.5px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(examSessionVal, curX + midLineW / 2, y + 10);
            }

            curX += midLineW + 1;
            ctx.font = 'normal 12px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(yearPrefix, curX, y + 11);
            curX += yearPrefixW + 1;

            // Year suffix line after 20
            ctx.beginPath();
            ctx.moveTo(curX, y + 12);
            ctx.lineTo(originX + colW, y + 12);
            ctx.stroke();

            const examYearVal = getSheetVal(sheetIndex, 'exam-year');
            if (examYearVal) {
                ctx.font = 'normal 11.5px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(examYearVal, curX + 2, y + 10);
            }

            y += 20;

            // 4. Course Line: Course__________________________
            ctx.font = 'normal 12px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';
            const courseLabel = 'Course';
            ctx.fillText(courseLabel, originX, y + 11);
            const courseLabelW = ctx.measureText(courseLabel).width;

            ctx.beginPath();
            ctx.moveTo(originX + courseLabelW + 2, y + 12);
            ctx.lineTo(originX + colW, y + 12);
            ctx.stroke();

            const courseVal = getSheetVal(sheetIndex, 'course');
            if (courseVal) {
                ctx.font = 'normal 11.5px Arial, Helvetica, sans-serif';
                ctx.fillText(courseVal, originX + courseLabelW + 6, y + 10);
            }

            y += 18;

            // 5. Main Table (2 Header Rows + 25 Student Rows + 1 TOTAL Row)
            const tableTop = y;
            const regColW = Math.round(colW * 0.38);
            const figColW = Math.round(colW * 0.20);
            const wordsColW = colW - regColW - figColW;

            const headerRowH = 22;
            const dataRowH = 26.5;
            const totalRowsCount = TOTAL_ROWS + 1; // 25 student rows + 1 TOTAL row
            const tableH = (headerRowH * 2) + (dataRowH * totalRowsCount);

            // Outer Table Border
            ctx.lineWidth = 1.4;
            ctx.strokeRect(originX, tableTop, colW, tableH);

            // Vertical Column Dividers
            ctx.lineWidth = 1;
            // Between Register Number and Figures
            ctx.beginPath();
            ctx.moveTo(originX + regColW, tableTop);
            ctx.lineTo(originX + regColW, tableTop + tableH);
            ctx.stroke();

            // Between Figures and in words (starts from header row 2)
            ctx.beginPath();
            ctx.moveTo(originX + regColW + figColW, tableTop + headerRowH);
            ctx.lineTo(originX + regColW + figColW, tableTop + tableH);
            ctx.stroke();

            // Horizontal divider between Marks and Figures/in words
            ctx.beginPath();
            ctx.moveTo(originX + regColW, tableTop + headerRowH);
            ctx.lineTo(originX + colW, tableTop + headerRowH);
            ctx.stroke();

            // Horizontal divider below Header Row 2
            ctx.beginPath();
            ctx.moveTo(originX, tableTop + headerRowH * 2);
            ctx.lineTo(originX + colW, tableTop + headerRowH * 2);
            ctx.stroke();

            // Header Texts
            ctx.font = 'normal 11.5px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Register Number', originX + regColW / 2, tableTop + headerRowH);
            ctx.fillText('Marks', originX + regColW + (figColW + wordsColW) / 2, tableTop + headerRowH / 2);
            ctx.fillText('Figures', originX + regColW + figColW / 2, tableTop + headerRowH + headerRowH / 2);
            ctx.fillText('in words', originX + regColW + figColW + wordsColW / 2, tableTop + headerRowH + headerRowH / 2);

            // 25 Student Rows + 1 TOTAL Row
            let rowY = tableTop + headerRowH * 2;
            for (let r = 0; r < TOTAL_ROWS; r++) {
                // Row bottom line
                ctx.beginPath();
                ctx.moveTo(originX, rowY + dataRowH);
                ctx.lineTo(originX + colW, rowY + dataRowH);
                ctx.stroke();

                const regVal = getSheetVal(sheetIndex, `reg-${r}`).toUpperCase();
                const figVal = getSheetVal(sheetIndex, `fig-${r}`).toUpperCase();
                const wordsVal = getSheetVal(sheetIndex, `words-${r}`).toUpperCase();

                const centerY = rowY + dataRowH / 2 + 0.5;

                if (regVal) {
                    ctx.font = 'bold 11.5px Arial, Helvetica, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(regVal, originX + regColW / 2, centerY);
                }
                if (figVal) {
                    ctx.font = 'bold 11.5px Arial, Helvetica, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(figVal, originX + regColW + figColW / 2, centerY);
                }
                if (wordsVal) {
                    ctx.font = 'bold 10.5px Arial, Helvetica, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(wordsVal, originX + regColW + figColW + wordsColW / 2, centerY);
                }

                rowY += dataRowH;
            }

            // TOTAL Row
            const totalCenterY = rowY + dataRowH / 2 + 0.5;
            ctx.font = 'bold 11.5px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('TOTAL', originX + 5, totalCenterY);

            const totalFigVal = getSheetVal(sheetIndex, 'total-fig').toUpperCase();
            const totalWordsVal = getSheetVal(sheetIndex, 'total-words').toUpperCase();
            if (totalFigVal) {
                ctx.textAlign = 'center';
                ctx.fillText(totalFigVal, originX + regColW + figColW / 2, totalCenterY);
            }
            if (totalWordsVal) {
                ctx.font = 'bold 10.5px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(totalWordsVal, originX + regColW + figColW + wordsColW / 2, totalCenterY);
            }

            y = tableTop + tableH + 16;

            // 6. Bottom Signature Block
            ctx.textBaseline = 'alphabetic';
            const labelColW = Math.round(colW * 0.31);
            const colonColW = Math.round(colW * 0.04);
            const nameColW = Math.round(colW * 0.35);
            const signColW = colW - labelColW - colonColW - nameColW;

            // Underlined Name and Signature headers
            ctx.font = 'normal 11.5px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'center';
            const nameHeaderX = originX + labelColW + colonColW + nameColW / 2;
            const signHeaderX = originX + labelColW + colonColW + nameColW + signColW / 2;

            ctx.fillText('Name', nameHeaderX, y);
            const nameW = ctx.measureText('Name').width;
            ctx.beginPath();
            ctx.moveTo(nameHeaderX - nameW / 2, y + 2);
            ctx.lineTo(nameHeaderX + nameW / 2, y + 2);
            ctx.stroke();

            ctx.fillText('Signature', signHeaderX, y);
            const signW = ctx.measureText('Signature').width;
            ctx.beginPath();
            ctx.moveTo(signHeaderX - signW / 2, y + 2);
            ctx.lineTo(signHeaderX + signW / 2, y + 2);
            ctx.stroke();

            const sigRows = [
                { label: 'Addl. Examiner', field: 'addl-examiner' },
                { label: 'Chief Examiner', field: 'chief-examiner' },
                { label: 'Chairman', field: 'chairman' }
            ];

            sigRows.forEach(item => {
                y += 22;
                ctx.font = 'italic bold 11.5px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(item.label, originX, y);

                ctx.font = 'bold 11.5px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(':', originX + labelColW + colonColW / 2, y);

                const val = getSheetVal(sheetIndex, item.field);
                if (val) {
                    ctx.font = 'normal 11px Arial, Helvetica, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(val, originX + labelColW + colonColW + 4, y);
                }
            });

            // Date & Session Row
            y += 22;
            ctx.font = 'italic bold 11.5px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Date', originX, y);

            ctx.font = 'bold 11.5px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(':', originX + labelColW + colonColW / 2, y);

            const dateVal = getSheetVal(sheetIndex, 'date');
            if (dateVal) {
                ctx.font = 'normal 11px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(dateVal, originX + labelColW + colonColW + 4, y);
            }

            const sessionVal = getSheetVal(sheetIndex, 'session-fn-an') || 'FN / AN';
            ctx.font = 'bold 11px Arial, Helvetica, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`SESSION : ${sessionVal}`, originX + colW, y);
        }

        // Export High-Resolution Side-by-Side A4 PDF ([QPCODE]_[DATE].pdf)
        function downloadPDFFile() {
            const btn = document.getElementById('downloadPdfBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Generating PDF...';
            btn.disabled = true;

            try {
                // Ensure Duplicate has latest Original values
                syncAllFromOriginalToDuplicate();

                // Create 3x Scale High-DPI A4 Canvas (794x1123 logical px -> 2382x3369 actual px)
                const scaleFactor = 3;
                const logicalW = 794;
                const logicalH = 1123;

                const canvas = document.createElement('canvas');
                canvas.width = logicalW * scaleFactor;
                canvas.height = logicalH * scaleFactor;

                const ctx = canvas.getContext('2d');
                ctx.scale(scaleFactor, scaleFactor);

                // White A4 Page Background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, logicalW, logicalH);

                // Page Padding & 2-Column Geometry
                const padX = 26;
                const padY = 24;
                const colGap = 28;
                const colW = (logicalW - (padX * 2) - colGap) / 2; // 357px per column

                // Draw Left Column (ORIGINAL) and Right Column (DUPLICATE)
                renderSingleSheetOnCanvas(ctx, 1, padX, padY, colW);
                renderSingleSheetOnCanvas(ctx, 2, padX + colW + colGap, padY, colW);

                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                pdf.save(`${getDynamicFileName()}.pdf`);
            } catch (err) {
                console.error('PDF export error:', err);
                printMarkSheet();
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Responsive Mobile Scaling: Default is 'preview' (Fit Full A4 Side-by-Side to Screen)
        let currentMobileMode = 'preview';

        function setMobileViewMode(mode) {
            currentMobileMode = mode;
            const tabEntry = document.getElementById('tabEntryMode');
            const tabPreview = document.getElementById('tabPreviewMode');

            if (mode === 'entry') {
                document.body.classList.add('mobile-entry-mode');
                tabEntry.classList.add('active');
                tabPreview.classList.remove('active');
            } else {
                document.body.classList.remove('mobile-entry-mode');
                tabEntry.classList.remove('active');
                tabPreview.classList.add('active');
            }
            applyMobileScaling();
        }

        function selectMobileSheet(sheetNum) {
            const s1 = document.getElementById('sheet-1');
            const s2 = document.getElementById('sheet-2');
            const b1 = document.getElementById('btnSheet1');
            const b2 = document.getElementById('btnSheet2');

            if (sheetNum === 1) {
                s1.classList.add('mobile-active-sheet');
                s2.classList.remove('mobile-active-sheet');
                b1.classList.add('active');
                b2.classList.remove('active');
            } else {
                s1.classList.remove('mobile-active-sheet');
                s2.classList.add('mobile-active-sheet');
                b1.classList.remove('active');
                b2.classList.add('active');
            }
        }

        function applyMobileScaling() {
            const viewport = document.getElementById('pageViewport');
            if (currentMobileMode === 'entry') {
                document.body.classList.add('mobile-entry-mode');
                a4Container.style.transform = 'none';
                viewport.style.height = 'auto';
                return;
            }

            document.body.classList.remove('mobile-entry-mode');
            const availableWidth = document.documentElement.clientWidth - 16;
            const a4PixelWidth = 794;

            if (availableWidth < a4PixelWidth) {
                const scale = availableWidth / a4PixelWidth;
                a4Container.style.transform = `scale(${scale})`;
                viewport.style.height = `${Math.ceil(1123 * scale) + 12}px`;
            } else {
                a4Container.style.transform = 'none';
                viewport.style.height = 'auto';
            }
        }

        window.addEventListener('resize', applyMobileScaling);
        window.addEventListener('DOMContentLoaded', applyMobileScaling);
        applyMobileScaling();

        // Modal Controls for Clear All
        function openClearModal() {
            document.getElementById('clearModal').classList.add('active');
        }

        function closeClearModal() {
            document.getElementById('clearModal').classList.remove('active');
        }

        function confirmClearAll() {
            const allInputs = a4Container.querySelectorAll('input');
            allInputs.forEach(inp => { inp.value = ''; });
            const allSelects = a4Container.querySelectorAll('select');
            allSelects.forEach(sel => { sel.selectedIndex = 0; });
            closeClearModal();
        }
    </script>
